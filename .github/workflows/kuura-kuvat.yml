name: Kuura-aamujen kamerakuvat
on:
  schedule:
    - cron: '23,53 2-9 * * *'   # aamuisin 30 min välein (klo 04.23–11.53 talviaikaa)
  workflow_dispatch:
    inputs:
      testi:
        description: 'Testiajo: hae 5 kuvaa ja parien määrä, ei tallennusta'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: kuura-kuvat
jobs:
  kuvat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # kuvat eivät tule mukaan, vain tilatiedot ja tämän päivän havainnot
          sparse-checkout: |
            meta
            data/current
            kuura/meta
            kuura/data
      - name: Kuvankäsittely
        run: pip install -q pillow
      - name: Kerää kuvat
        run: python3 kuura_kuvat.py ${{ (github.event_name == 'workflow_dispatch' && inputs.testi) && '--test' || '' }}
      - name: Tallenna säilöön
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.testi) }}
        run: |
          git config user.name "keli-bot"
          git config user.email "keli-bot@users.noreply.github.com"
          git add --sparse -A kuura
          git diff --cached --quiet && exit 0
          git commit -q -m "Kuura-kuvat $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push -q && exit 0
            sleep $((i*7))
            git pull -q --rebase origin main || exit 1
          done
          exit 1
