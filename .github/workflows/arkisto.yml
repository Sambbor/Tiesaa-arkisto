name: Tiesää-arkisto
on:
  schedule:
    - cron: '11,41 * * * *'   # varalla; varsinainen tahti Arkiston ajastimesta (ajastin.yml), ks. vahti-työ
  workflow_dispatch:
permissions:
  contents: write
concurrency: arkisto
jobs:
  # ka3 (30.10.2026): Arkiston ajastin (ajastin.yml) käynnistää arkiston tasan :11/:41. Ajastettu (schedule) ajo on varalla:
  # se ohitetaan, jos käsin/ajastimella käynnistetty arkistoajo on alkanut alle 35 min sitten.
  vahti:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      aja: ${{ steps.v.outputs.aja }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          aja=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list --workflow arkisto.yml --event workflow_dispatch --limit 5 --json createdAt --jq '[.[] | select(now - (.createdAt | fromdateiso8601) < 2100)] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then aja=false; echo "Ajastin hoitaa arkiston – ajastettu varakeruu ohitetaan"; fi
          fi
          echo "aja=$aja" >> "$GITHUB_OUTPUT"
  collect:
    needs: vahti
    if: needs.vahti.outputs.aja == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # haetaan vain tämän päivän tiedostot ja tilatiedot, ei koko arkistoa
          sparse-checkout: |
            meta
            data/current
            tm
            om
            suomi
            retro/yot
      - name: Kerää asemat ja ennusteet
        run: python3 arkisto.py
      - name: Kerää talvihoidon toteumat asemien ympäriltä
        # ei kaada arkistoa, jos toteumahaku epäonnistuu
        run: python3 toteumat.py || echo "Toteumakeruu epäonnistui, jatketaan"
      - name: Naapuriurakat samana yönä (kelisivu)
        run: python3 naapurit.py || echo "Naapuriurakoiden koonti epäonnistui, jatketaan"
      # su1 (6.11.2026, Samuli: "Koko Suomi, julkinen ilman nimiä"): kaikkien hoitourakoiden yö (riski ja toimenpiteet) → suomi/, data/suomi.json
      - name: Koko Suomen yökooste (su1)
        run: python3 suomi.py || echo "Koko Suomen yökooste epäonnistui, jatketaan"
      - name: Urakoiden tieverkko (kelisivun kartta, 30 vrk välein)
        run: python3 tieverkko.py || echo "Tieverkon haku epäonnistui, jatketaan"
      # tv1 (2.11.2026): oma tienpintamalli varjona Vantaan asemille. Malli opetetaan tienpintamalli.yml:ssä kerran vuorokaudessa ja
      # haetaan Actionsin välimuistista. Ei vaikuta kelisivun indeksiin; virhe ei kaada arkistoa.
      - name: Tienpintamalli välimuistista (tv1)
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .tm_model
          key: tm-model-uusin
          restore-keys: tm-model-
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tm_requirements.txt
      - name: Tienpintamallin varjoennuste ja tarkistus (tv1)
        continue-on-error: true
        run: pip install -q --disable-pip-version-check -r tm_requirements.txt && python3 tm_varjo.py predict
      # om2 (3.11.2026, Samuli: "Tee"): oppiva liukkausmalli varjona (+3 h, raja 1/9). Koodi yksityisestä säilöstä lukuavaimella,
      # malli samasta välimuistista (.tm_model/om.pkl). Tulokset om/. Ei vaikuta kelisivuun; virhe ei kaada arkistoa.
      - name: Hae oppivan mallin koodi (yksityinen säilö, CODE_TOKEN)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: Sambbor/Vantaakeli-laskenta
          token: ${{ secrets.CODE_TOKEN }}
          path: .laskenta
          sparse-checkout: om
      - name: Oppivan mallin varjoennuste ja tarkistus (om2)
        continue-on-error: true
        run: python3 .laskenta/om/om_varjo.py predict
      - name: Tallenna säilöön
        run: |
          git config user.name "keli-bot"
          git config user.email "keli-bot@users.noreply.github.com"
          # Jos toinen ajo ehti tallentaa ensin (GitHub käynnistää joskus kaksi ajoa), ei yritetä yhdistää samoja
          # tiedostoja: siirrytään uusimpaan versioon ja ajetaan keruu uudelleen sen päälle.
          for i in 1 2 3; do
            git add --sparse -A tm om 2>/dev/null || git add --sparse -A tm 2>/dev/null || true   # tv1: oma rivi (alla oleva ketju päätyy yleensä 'meta data' -muotoon, koska archive ja naapurit puuttuvat)
            git add --sparse -A suomi 2>/dev/null || true   # su1
            git add --sparse -A meta data archive naapurit 2>/dev/null || git add --sparse -A meta data archive 2>/dev/null || git add --sparse -A meta data
            git diff --cached --quiet && exit 0
            git commit -q -m "Tiesää-arkisto $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q && exit 0
            echo "Säilö muuttui ajon aikana – haetaan uusin versio ja kerätään uudelleen ($i)"
            sleep $((i*5))
            git fetch -q origin main && git reset -q --hard origin/main
            python3 arkisto.py || exit 1
            python3 toteumat.py || echo "Toteumakeruu epäonnistui, jatketaan"
            python3 naapurit.py || echo "Naapuriurakoiden koonti epäonnistui, jatketaan"
            python3 suomi.py || echo "Koko Suomen yökooste epäonnistui, jatketaan"
            python3 tm_varjo.py predict || echo "Tienpintamallin varjo epäonnistui, jatketaan"
            [ -f .laskenta/om/om_varjo.py ] && { python3 .laskenta/om/om_varjo.py predict || echo "Oppivan mallin varjo epäonnistui, jatketaan"; }
          done
          exit 1
