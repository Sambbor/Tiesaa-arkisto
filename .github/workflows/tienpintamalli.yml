name: Tienpintamallin opetus (varjo)
# tv1 (2.11.2026, Samuli: "Aloitetaan varjoajo"): oma tienpintamalli opetetaan kerran vuorokaudessa koko arkistolla (tm_varjo.py train)
# ja tallennetaan Actionsin välimuistiin (ei säilöön). Arkistoajo (arkisto.yml) hakee uusimman mallin ja ennustaa Vantaan asemille.
on:
  schedule:
    - cron: '23 3 * * *'   # klo 05.23 Suomen aikaa (talviaika)
  workflow_dispatch:
permissions:
  contents: read
concurrency: tienpintamalli
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tm_requirements.txt
      - name: Asenna kirjastot
        run: pip install -q --disable-pip-version-check -r tm_requirements.txt
      - name: Opeta malli (+2/+4/+6/+12 h)
        run: python3 tm_varjo.py train
      - name: Tallenna malli välimuistiin
        uses: actions/cache/save@v4
        with:
          path: .tm_model
          key: tm-model-${{ github.run_id }}
