name: Tienpintamallin opetus (varjo)
# tv1 (2.11.2026, Samuli: "Aloitetaan varjoajo"): oma tienpintamalli opetetaan kerran vuorokaudessa koko arkistolla (tm_varjo.py train)
# ja tallennetaan Actionsin välimuistiin (ei säilöön). Arkistoajo (arkisto.yml) hakee uusimman mallin ja ennustaa Vantaan asemille.
on:
  schedule:
    - cron: '23 3 * * *'   # klo 05.23 Suomen aikaa (talviaika)
  workflow_dispatch:
permissions:
  contents: write   # km1: km/testi.json säilöön
concurrency: tienpintamalli
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tm_requirements.txt
      - name: Asenna kirjastot
        run: pip install -q --disable-pip-version-check -r tm_requirements.txt
      - name: Opeta malli (+2/+4/+6/+12 h)
        run: python3 tm_varjo.py train
      # km1 (10.11.2026, kierros 2 kohta 3d): kuurapistemalli (kastepiste ja erotus tie − kastepiste) samaan välimuistiin
      - name: Opeta kuurapistemalli (km1)
        continue-on-error: true
        run: python3 km_varjo.py train
      - name: Tallenna kuurapistemallin testi säilöön (km/testi.json)
        continue-on-error: true
        run: |
          git config user.name "keli-bot"; git config user.email "keli-bot@users.noreply.github.com"
          git add km/testi.json && (git diff --cached --quiet || git commit -q -m "Kuurapistemallin testi $(date -u +%Y-%m-%d)")
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep $((i*5)); done
      # om2 (3.11.2026): oppiva liukkausmalli (+3 h) opetetaan samassa ajossa; koodi yksityisestä säilöstä, malli samaan välimuistiin.
      - name: Hae oppivan mallin koodi (yksityinen säilö, CODE_TOKEN)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: Sambbor/Vantaakeli-laskenta
          token: ${{ secrets.CODE_TOKEN }}
          path: .laskenta
          sparse-checkout: om
      - name: Opeta oppiva liukkausmalli (om2)
        continue-on-error: true
        run: python3 .laskenta/om/om_varjo.py train
      - name: Tallenna malli välimuistiin
        uses: actions/cache/save@v4
        with:
          path: .tm_model
          key: tm-model-${{ github.run_id }}
