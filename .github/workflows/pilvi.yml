name: Pilvimaski (varjo)
# pi1 (12.11.2026, Samuli: "Aloita"): satelliitin pilvimaski (EUMETSAT, Meteosat 0° Cloud Mask) Etelä-Suomen päältä 15 min välein
# arkistoon. Varjokeruu: ei vaikuta kelisivuun eikä ilmoituksiin. Tavoite: selvittää talven aikana, kertooko pilven rakoilu tai
# pysyminen tienpinnan jäähtymisestä etukäteen. Takautuva haku: Run workflow, alku = YYYY-MM-DD (historiaa 2020 alkaen).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      alku:
        description: 'Takautuva haku alkaen YYYY-MM-DD (tyhjä = tavallinen ajo)'
        required: false
        default: ''
permissions:
  contents: write
concurrency: pilvi
jobs:
  pilvi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            meta
            data/current
      - name: Hae pilvimaski
        env:
          PILVI_ALKU: ${{ inputs.alku }}
        run: python3 pilvi.py
      - name: Tallenna säilöön
        run: |
          git config user.name "keli-bot"
          git config user.email "keli-bot@users.noreply.github.com"
          git add --sparse -A data/current meta/pilvi_state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Pilvimaski $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            echo "Säilö muuttui – yritetään uudelleen ($i)"; sleep $((i*10))
          done
          exit 1
