name: Koko Suomen tieverkko
# tv2 (27.11.2026, Samuli: koko Suomen toimenpidekartta): kaikkien maanteiden hoitourakoiden tieverkot → data/urakat/<urakkakoodi>.json
# ja data/urakat/index.json. Toimenpidekartta (Vantaakeli/suomi/) lukee ne. Ajot haetaan sivulla suoraan Digitrafficista, niitä ei tallenneta.
# Kerran kuukaudessa; tiedosto kirjoitetaan vain, kun tieverkko muuttuu. Käsin ajettaessa haetaan aina uudelleen.
on:
  schedule:
    - cron: '37 2 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: tieverkko-suomi
jobs:
  tieverkko:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tieverkko.py
            /data/urakat/
            /meta/tieverkko_suomi.json
      - name: Hae tieverkot
        run: python3 tieverkko.py --suomi ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Tallenna säilöön
        run: |
          git config user.name "keli-bot"
          git config user.email "keli-bot@users.noreply.github.com"
          git add --sparse -A data/urakat meta/tieverkko_suomi.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Koko Suomen tieverkko $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            echo "Säilö muuttui – yritetään uudelleen ($i)"; sleep $((i*10))
          done
          exit 1
