name: Arkiston ajastin
# ka3 (30.10.2026, Samuli): GitHubin ajastetut ajot viivästyvät ja jäävät osin tulematta (30.10. yöllä arkisto ajoi 00.16 → 04.07 → 10.33).
# Tämä ajo käynnistää arkiston (arkisto.yml) tasan :11 ja :41 UTC noin 5 h 40 min ajan ja käynnistää lopuksi itsensä uudelleen.
# Varalla cron: jos ketju katkeaa, ajastin käynnistyy uudelleen viimeistään 3 h kuluttua (jonoon jäävä varakäynnistys peruuntuu –
# "cancelled" Actionsissa on normaalia). Käsin peruttu ajastin ei käynnisty itse uudelleen. Julkisessa säilössä ajominuutit ovat ilmaisia.
on:
  workflow_dispatch:
  schedule:
    - cron: '5 1-23/3 * * *'
permissions:
  actions: write
concurrency: ajastin
jobs:
  ajastin:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Käynnistä arkisto puolen tunnin välein (:11 ja :41 UTC)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          loppu=$(( $(date +%s) + 340*60 ))
          while :; do
            nyt=$(date +%s)
            seuraava=$(( nyt - (nyt - 660) % 1800 + 1800 ))   # 660 s = 11 min; jakso 30 min
            [ "$seuraava" -gt "$loppu" ] && break
            sleep $(( seuraava - nyt ))
            echo "$(date -u +%H:%M:%S) käynnistetään arkisto"
            gh workflow run arkisto.yml --ref main || echo "::warning::Arkiston käynnistys epäonnistui"
          done
      - name: Käynnistä ajastin uudelleen
        if: success() || failure()   # ei peruttaessa: käsin peruttu ketju pysähtyy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3; do gh workflow run ajastin.yml --ref main && exit 0; sleep 20; done
          exit 1
