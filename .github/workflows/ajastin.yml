name: Arkiston ajastin
# ka3 (30.10.2026, Samuli): GitHubin ajastetut ajot viivästyvät ja jäävät osin tulematta (30.10. yöllä arkisto ajoi 00.16 → 04.07 → 10.33).
# Tämä ajo käynnistää arkiston (arkisto.yml) tasan :11 ja :41 UTC noin 5 h 40 min ajan ja käynnistää lopuksi itsensä uudelleen.
# Varalla cron: jos ketju katkeaa, ajastin käynnistyy uudelleen viimeistään 3 h kuluttua (jonoon jäävä varakäynnistys peruuntuu –
# "cancelled" Actionsissa on normaalia). Käsin peruttu ajastin ei käynnisty itse uudelleen. Julkisessa säilössä ajominuutit ovat ilmaisia.
# su6 (6.11.2026): jälkitarkistus (retro.yml) käynnistetään täältä klo 08.11 Suomen aikaa; GitHubin oma ajastus viivästyi noin 8 h.
# ka4 (3.11.2026): myös kuura-kuvat (kuura-kuvat.yml) käynnistetään täältä :23 ja :53 UTC, kun Suomen aikaa on klo 04.30–12.00.
# Pelkällä cronilla kuura-kuvat ajettiin 27.10.–3.11. noin 1–2 kertaa päivässä, osin iltapäivällä, ja A-kuva (ennen klo 06) saatiin vain kerran.
on:
  workflow_dispatch:
  schedule:
    - cron: '5 1-23/3 * * *'
permissions:
  actions: write
concurrency: ajastin
jobs:
  ajastin:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Käynnistä arkisto (:11 ja :41 UTC) ja aamuisin kuura-kuvat (:23 ja :53 UTC)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          loppu=$(( $(date +%s) + 340*60 ))
          while :; do
            nyt=$(date +%s)
            ark=$(( nyt - (nyt - 660) % 1800 + 1800 ))    # 660 s = 11 min; jakso 30 min (:11, :41)
            kuu=$(( nyt - (nyt - 1380) % 1800 + 1800 ))   # 1380 s = 23 min (:23, :53)
            seuraava=$(( ark < kuu ? ark : kuu ))
            [ "$seuraava" -gt "$loppu" ] && break
            sleep $(( seuraava - nyt ))
            if [ "$seuraava" = "$ark" ]; then
              echo "$(date -u +%H:%M:%S) käynnistetään arkisto"
              gh workflow run arkisto.yml --ref main || echo "::warning::Arkiston käynnistys epäonnistui"
              # su6: jälkitarkistus kerran aamussa klo 08.11 Suomen aikaa (oma jono, ks. retro.yml)
              if [ "$(TZ=Europe/Helsinki date -d "@$seuraava" +%H%M)" = "0811" ]; then
                echo "$(date -u +%H:%M:%S) käynnistetään jälkitarkistus"
                gh workflow run retro.yml --ref main || echo "::warning::Jälkitarkistuksen käynnistys epäonnistui"
              fi
            else
              hm=$(TZ=Europe/Helsinki date -d "@$seuraava" +%H%M)
              if [ $((10#$hm)) -ge 430 ] && [ $((10#$hm)) -lt 1200 ]; then
                echo "$(date -u +%H:%M:%S) käynnistetään kuura-kuvat (Suomen aikaa $hm)"
                gh workflow run kuura-kuvat.yml --ref main -f testi=false || echo "::warning::Kuura-kuvien käynnistys epäonnistui"
              fi
            fi
          done
      - name: Käynnistä ajastin uudelleen
        if: success() || failure()   # ei peruttaessa: käsin peruttu ketju pysähtyy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3; do gh workflow run ajastin.yml --ref main && exit 0; sleep 20; done
          exit 1
